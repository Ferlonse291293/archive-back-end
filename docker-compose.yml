services:
  backend:
    container_name: express-backend
    image: node:24
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npx prisma generate && npm run dev"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://appuser:12345678@postgres:5432/appdb
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    depends_on:
      - postgres
    restart: unless-stopped

  prisma-studio:
    container_name: prisma-studio
    image: node:24
    working_dir: /app
    ports:
      - "5555:5555"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npx prisma studio --port 5555 --browser none"
    environment:
      DATABASE_URL: postgresql://appuser:12345678@postgres:5432/appdb
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    container_name: postgres
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  node_modules:
  postgres_data:
